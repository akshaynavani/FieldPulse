# Local PostgreSQL for development. `docker compose up -d db`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldpulse
      POSTGRES_PASSWORD: fieldpulse
      POSTGRES_DB: fieldpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
