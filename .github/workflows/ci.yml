name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npx turbo run lint --cache-dir=.turbo

      - name: Typecheck
        run: npx turbo run typecheck --cache-dir=.turbo

      - name: Test
        run: npx turbo run test --cache-dir=.turbo

      - name: Build packages, API and web
        run: npx turbo run build --cache-dir=.turbo --filter=!@fieldpulse/mobile

  migrations:
    name: Migrations against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fieldpulse
          POSTGRES_PASSWORD: fieldpulse
          POSTGRES_DB: fieldpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldpulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fieldpulse:fieldpulse@localhost:5432/fieldpulse
      SEED_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@fieldpulse/api^...
      - name: Apply migrations
        run: npm run db:migrate
      - name: Migrations are idempotent
        run: npm run db:migrate
      - name: Seed demo data
        run: npm run db:seed

  mobile:
    name: Mobile bundle check
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@fieldpulse/mobile^...
      - name: Export JS bundle (catches Metro resolution errors)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist
